<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- Security: only this page's own script runs (its hash below; recompute it if the script changes),
     and the page only talks to Atelier's server and Google Fonts. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-/ihtmGDa3AAI4iktyEMSnv6SQkiSmP/ejdE/9ph0oEc='; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src https://vfjvxixxmhevkvmlrpoq.supabase.co data:; connect-src https://vfjvxixxmhevkvmlrpoq.supabase.co; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Atelier · Moodboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Jost:wght@300..600&display=swap" rel="stylesheet">
<style>
  :root { --paper:#fff; --surface:#F7F6F4; --line:#DAD8D3; --stone:#7A7671; --graphite:#4A4744; --ink:#0E0D0D; --wine:#6E1A27; --note:#F4EDE0; --tape:rgba(214,200,170,.7); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: Jost, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 560px; margin: 0 auto; }
  .eyebrow { font-size: 11px; letter-spacing: .28em; text-transform: uppercase; color: var(--stone); }
  .folio { display: flex; justify-content: space-between; }
  section { padding: 32px 24px; border-bottom: 1px solid var(--line); }
  h1, h2 { font-family: 'Bodoni Moda', serif; font-weight: 400; margin: 0; }
  i, em { font-style: italic; }

  .cover { position: relative; height: min(92vh, 760px); padding: 0; background: #3A3633; color: #fff; overflow: hidden; border: 0; }
  .cover .grid { position: absolute; inset: 0; display: grid; grid-template-columns: 1.2fr 1fr; grid-template-rows: 1fr 1fr; gap: 3px; }
  .cover .grid img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover .grid img:first-child { grid-row: span 2; }
  .cover .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(14,13,13,.5), rgba(14,13,13,0) 34%, rgba(14,13,13,0) 52%, rgba(14,13,13,.75)); }
  .cover .mast { position: absolute; top: 18px; left: 0; right: 0; text-align: center; font-family: 'Bodoni Moda', serif; font-size: clamp(56px, 17vw, 96px); line-height: .9; letter-spacing: 2px; }
  .cover .meta { position: absolute; top: calc(18px + clamp(56px, 17vw, 96px)); left: 20px; right: 20px; display: flex; justify-content: space-between; font-size: 9px; letter-spacing: .28em; text-transform: uppercase; }
  .cover .foot { position: absolute; left: 20px; right: 20px; bottom: 28px; display: flex; flex-direction: column; gap: 10px; }
  .cover h1 { font-size: clamp(40px, 12vw, 64px); line-height: .95; letter-spacing: -1px; }
  .cover .eyebrow { color: #fff; }
  .rise { animation: rise 1s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

  .palette { display: grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: 10px; margin-top: 16px; }
  .swatch { aspect-ratio: 1; border-radius: 999px; border: 1px solid var(--line); }
  .swatch-name { font-size: 11px; color: var(--graphite); text-align: center; margin-top: 4px; }
  .note { position: relative; background: var(--note); padding: 18px 20px 14px; margin-top: 26px; transform: rotate(-1deg); box-shadow: 0 8px 16px -10px rgba(42,37,35,.4); }
  .note::before { content: ''; position: absolute; top: -9px; left: 42%; width: 64px; height: 18px; background: var(--tape); transform: rotate(2deg); }
  .note p { margin: 6px 0 0; font-family: 'Bodoni Moda', serif; font-size: 19px; line-height: 1.4; }
  .note .eyebrow { color: var(--wine); }

  .looks { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  .looks figure { margin: 0; }
  .looks figure:nth-child(even) { margin-top: 40px; }
  .looks img { width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block; background: var(--surface); border-radius: 4px; }
  .looks figcaption { font-family: 'Bodoni Moda', serif; font-size: 15px; margin-top: 6px; }

  .pieces { margin: 16px 0 0; padding: 0; list-style: none; }
  .pieces li { display: grid; grid-template-columns: 34px 1fr; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); }
  .pieces li span:first-child { font-family: 'Bodoni Moda', serif; font-size: 18px; }
  .pieces b { font-weight: 500; display: block; }
  .pieces small { color: var(--graphite); font-size: 14px; line-height: 1.5; }
  .formula { padding: 12px 0; border-top: 1px solid var(--line); }
  .formula h3 { font-family: 'Bodoni Moda', serif; font-weight: 400; font-style: italic; font-size: 19px; margin: 0 0 4px; }
  .formula p { margin: 0; color: var(--graphite); font-size: 14px; line-height: 1.5; }

  .end { display: flex; flex-direction: column; gap: 14px; border: 0; padding-bottom: 56px; }
  .end h2 { font-size: 32px; line-height: 1.1; }
  .end p { margin: 0; color: var(--graphite); line-height: 1.6; }
  .cta { display: flex; align-items: center; justify-content: center; height: 52px; background: var(--wine); color: #fff; text-transform: uppercase; letter-spacing: .14em; font-size: 14px; font-weight: 500; }

  .state { min-height: 70vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 24px; }
  .state h1 { font-size: 34px; }
  .reveal { opacity: 0; transform: translateY(24px); transition: opacity .9s cubic-bezier(.2,.8,.2,1), transform .9s cubic-bezier(.2,.8,.2,1); }
  .reveal.in { opacity: 1; transform: none; }
</style>
</head>
<body>
<main id="app">
  <div class="state"><div class="eyebrow">Atelier</div><h1>Abriendo la edición…</h1></div>
</main>
<script>
  // Public moodboard viewer: reads one shared board from Atelier's public-board function.
  // The board's owner can turn the link off at any time; then this page shows "not available".
  const API = 'https://vfjvxixxmhevkvmlrpoq.supabase.co/functions/v1/public-board?b=';
  const app = document.getElementById('app');
  const slug = new URLSearchParams(location.search).get('b') || '';

  const el = (tag, attrs = {}, ...children) => {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'class') node.className = v;
      else if (k === 'style') node.setAttribute('style', v);
      else node.setAttribute(k, v);
    }
    for (const child of children.flat()) {
      if (child == null) continue;
      node.append(child instanceof Node ? child : document.createTextNode(String(child)));
    }
    return node;
  };
  const folio = (label, page) => el('div', { class: 'folio eyebrow' }, el('span', {}, label), el('span', {}, `p. ${String(page).padStart(2, '0')}`));
  const safeColor = (hex) => (/^#[0-9a-f]{6}$/i.test(hex) ? hex : '#DAD8D3');

  function unavailable() {
    app.replaceChildren(el('div', { class: 'state' },
      el('div', { class: 'eyebrow' }, 'Atelier'),
      el('h1', {}, 'Esta edición ya no está disponible'),
      el('p', { style: 'color:#4A4744;max-width:340px;line-height:1.6' }, 'Quien la compartió apagó el enlace o el enlace no es correcto.')));
  }

  function render(b) {
    document.title = `${b.title} · Atelier`;
    const images = b.images || [];
    let page = 1;
    const pages = [];

    pages.push(el('section', { class: 'cover' },
      el('div', { class: 'grid' }, images.slice(0, 3).map((src) => el('img', { src, alt: '' }))),
      el('div', { class: 'shade' }),
      el('div', { class: 'mast rise' }, 'ATELIER'),
      el('div', { class: 'meta' }, el('span', {}, 'Moodboard'), el('span', {}, new Date(b.created_at).toLocaleDateString('es', { month: 'long', year: 'numeric' }))),
      el('div', { class: 'foot' },
        el('span', { class: 'eyebrow' }, b.author ? `Una edición de ${b.author}` : 'Una edición de Atelier'),
        el('h1', {}, b.title),
        el('span', { style: 'font-size:12px;opacity:.85' }, 'Desliza para leer ↓'))));

    page += 1;
    pages.push(el('section', { class: 'reveal' },
      folio('La paleta', page),
      el('div', { class: 'palette' }, (b.palette || []).map((c) => el('div', {}, el('div', { class: 'swatch', style: `background:${safeColor(c.hex)}` }), el('div', { class: 'swatch-name' }, c.name)))),
      b.summary || b.notes ? el('div', { class: 'note' }, el('span', { class: 'eyebrow' }, 'La clave'), el('p', {}, b.notes || b.summary)) : null));

    if (images.length > 1) {
      page += 1;
      pages.push(el('section', { class: 'reveal' },
        folio('Los looks', page),
        el('div', { class: 'looks' }, images.slice(0, 4).map((src, i) =>
          el('figure', {}, el('img', { src, alt: '', loading: 'lazy' }), el('figcaption', {}, `${String(i + 1).padStart(2, '0')} · `, el('i', {}, (b.formulas?.[i]?.name) || 'Look')))))));
    }

    if ((b.key_pieces || []).length) {
      page += 1;
      pages.push(el('section', { class: 'reveal' },
        folio('Prendas clave', page),
        el('ul', { class: 'pieces' }, b.key_pieces.map((p, i) =>
          el('li', {}, el('span', {}, String(i + 1).padStart(2, '0')), el('span', {}, el('b', {}, p.name), el('small', {}, p.description)))))));
    }

    if ((b.formulas || []).length) {
      page += 1;
      pages.push(el('section', { class: 'reveal' },
        folio('Fórmulas', page),
        b.formulas.map((f) => el('div', { class: 'formula' }, el('h3', {}, f.name), el('p', {}, (f.pieces || []).join(' · ')), f.occasion ? el('p', { class: 'eyebrow', style: 'margin-top:6px' }, f.occasion) : null))));
    }

    page += 1;
    pages.push(el('section', { class: 'end reveal' },
      el('div', { class: 'eyebrow' }, `p. ${String(page).padStart(2, '0')} · Fin de la edición`),
      el('h2', {}, '¿Quieres ', el('i', {}, 'tu propia'), ' edición?'),
      el('p', {}, 'Atelier arma moodboards con tu colorimetría y tu armario, y te dice qué comprar.'),
      el('div', { class: 'cta' }, 'Atelier · pronto en Android')));

    app.replaceChildren(...pages);
    const io = new IntersectionObserver((entries) => entries.forEach((e) => e.isIntersecting && e.target.classList.add('in')), { threshold: 0.15 });
    document.querySelectorAll('.reveal').forEach((n) => io.observe(n));
  }

  if (!/^[a-z0-9]{6,24}$/.test(slug)) unavailable();
  else fetch(API + slug).then((r) => (r.ok ? r.json() : Promise.reject(r.status))).then(render).catch(unavailable);
</script>
</body>
</html>
